<script>
'use strict';
// This standalone file is a strictly offline, synthetic prototype. No personal user data is transmitted.
const NAV=[{heading:'วิเคราะห์ข้อมูล',items:[['overview','ภาพรวม Dashboard','home'],['demographics','ข้อมูลนักท่องเที่ยว','users'],['travel','รูปแบบการเดินทาง','compass'],['spending','ค่าใช้จ่ายและการซื้อ','wallet'],['satisfaction','ความพึงพอใจ','heart'],['insights','ข้อค้นพบสำหรับธุรกิจ','spark'],['reports','รายงานและส่งออก','file']]},{heading:'ระบบและข้อมูล',items:[['methodology','แหล่งข้อมูลและวิธีอ่าน','book'],['imports','นำเข้าข้อมูล','upload','admin'],['history','ประวัติการนำเข้า','layers','admin'],['sites','จัดการพื้นที่สำรวจ','map-pin','admin'],['users','จัดการผู้ใช้งาน','shield','admin'],['settings','ตั้งค่าระบบ','settings','admin']]}];
const ICON=(name,cls='')=>`<svg class="icon ${cls}"><use href="#ic-${name}"></use></svg>`;
const ESC=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n??0).toLocaleString('th-TH');
const DAY=24*3600*1000, ANCHOR=new Date('2026-10-19T12:00:00+07:00');
const ORIGINS=['ยะลา','ปัตตานี','นราธิวาส','สงขลา','จังหวัดอื่น','ต่างประเทศ'];
const AGES=['18–24 ปี','25–34 ปี','35–44 ปี','45–54 ปี','55 ปีขึ้นไป','ไม่ระบุ'];
const TRANSPORT=['รถยนต์ส่วนตัว','รถจักรยานยนต์','รถโดยสาร','รถเช่า','คณะทัวร์'];
const COMPANION=['ครอบครัว','เพื่อน','เดินทางคนเดียว','คู่รัก','คณะทัวร์'];
const PURPOSE=['พักผ่อน','ศาสนา/วัฒนธรรม','ศึกษาประวัติศาสตร์','ท่องเที่ยวกับครอบครัว'];
const DISCOVERY=['Facebook / TikTok','เพื่อนหรือครอบครัว','Google / เว็บไซต์','เคยมาแล้ว','อื่น ๆ'];
const EXPENSE=['ไม่เกิน 300 บาท','301–500 บาท','501–1,000 บาท','มากกว่า 1,000 บาท'];
const BUY=['อาหาร/เครื่องดื่ม','สินค้า/ของฝาก','เดินทาง','ที่พัก','ยังไม่ได้ซื้อ'];
const REVISIT=['กลับมาแน่นอน','อาจกลับมา','ไม่แน่ใจ','ไม่น่ากลับมา'];
const OPTIONS={origin:ORIGINS,age:AGES,transport:TRANSPORT,expense:EXPENSE};
const SITE0='วัดคูหาภิมุข (วัดหน้าถ้ำ)';
const state={route:'overview',role:'admin',period:90,origin:'all',age:'all',transport:'all',site:'all',compare:false,tab:'origin',users:[{name:'ผู้ดูแลระบบสาธิต',role:'Admin',status:'ใช้งาน',last:'วันนี้'},{name:'ผู้ประกอบการตัวอย่าง A',role:'Entrepreneur',status:'ใช้งาน',last:'เมื่อวาน'},{name:'ผู้ประกอบการตัวอย่าง B',role:'Entrepreneur',status:'ใช้งาน',last:'3 วันที่แล้ว'}],sites:[SITE0],importPreview:null,imports:[{name:'sample-survey-demo.csv',date:'ข้อมูลสาธิต',good:0,bad:0,duplicates:0,status:'ชุดทดลองเริ่มต้น'}],notificationOpen:false,theme:'light',compact:false};
let seed=87922;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function pick(arr,weights){let z=rand()*weights.reduce((a,b)=>a+b,0);for(let i=0;i<arr.length;i++){z-=weights[i];if(z<0)return arr[i]}return arr[arr.length-1]}
function makeSynthetic(n=296){let rows=[];for(let i=0;i<n;i++){const days=Math.floor(rand()*91),date=new Date(ANCHOR.getTime()-days*DAY);rows.push({id:`demo-${String(i+1).padStart(4,'0')}`,date:date.toISOString().slice(0,10),site:SITE0,age:pick(AGES,[21,28,22,14,11,4]),origin:pick(ORIGINS,[39,17,14,14,12,4]),transport:pick(TRANSPORT,[51,22,12,8,7]),companion:pick(COMPANION,[34,25,17,16,8]),purpose:pick(PURPOSE,[35,38,12,15]),discovery:rand()<.075?null:pick(DISCOVERY,[37,28,18,12,5]),expense:rand()<.13?null:pick(EXPENSE,[46,28,20,6]),purchase:rand()<.1?null:pick(BUY,[49,20,14,4,13]),satisfaction:rand()<.09?null:pick([1,2,3,4,5],[2,5,16,38,39]),revisit:rand()<.12?null:pick(REVISIT,[39,31,24,6]),synthetic:true})}return rows}
let DATA=makeSynthetic();

// Upgraded Chart.js queue & instance manager
let chartQueue=[];
let activeCharts=[];
let chartSeq=0;

function resetChartQueue(){
  chartQueue=[];
  while(activeCharts.length){
    const c=activeCharts.pop();
    if(c&&typeof c.destroy==='function')c.destroy();
  }
}

const daysBetween=(s)=>Math.ceil((ANCHOR-new Date(s+'T12:00:00+07:00'))/DAY);
function filtered(){return DATA.filter(r=>{let dif=daysBetween(r.date);return (state.period==='all'||dif<=+state.period)&&(state.origin==='all'||state.origin===r.origin)&&(state.age==='all'||state.age===r.age)&&(state.transport==='all'||state.transport===r.transport)&&(state.site==='all'||state.site===r.site)})}
function freq(rows,key,values){return values.map(v=>({name:v,count:rows.filter(x=>x[key]===v).length}))}
function answered(rows,key){return rows.filter(x=>x[key]!==null&&x[key]!==undefined&&x[key]!=='')}
function percent(n,d){return d?Math.round(n/d*100):0}
const suppressed=n=>state.role==='entrepreneur'&&n>0&&n<5;
function visibleNum(n){return suppressed(n)?'น้อยกว่า 5':fmt(n)}
function pctFmt(n,d){return suppressed(n)?'ปกปิด':`${percent(n,d)}%`}
function renderNav(){const el=document.getElementById('nav');el.innerHTML=NAV.map(g=>`<div class="nav-section"><div class="nav-label">${g.heading}</div><div class="nav">${g.items.filter(i=>i[3]!=='admin'||state.role==='admin').map(([key,label,ico])=>`<button type="button" class="nav-btn ${key===state.route?'active':''}" data-route="${key}" ${key===state.route?'aria-current="page"':''}>${ICON(ico)}<span class="nav-desc">${label}</span>${key==='imports'&&state.importPreview?'<span class="nav-pill">1</span>':''}</button>`).join('')}</div></div>`).join('')}
function nameForRoute(){for(const n of NAV)for(const a of n.items)if(a[0]===state.route)return a[1];return 'ภาพรวม Dashboard'}
function headers(title,sub,actions=true){return `<div class="page-heading"><div><div class="overline">YALA TOURISM / INSIGHTS</div><h1 class="page-title">${title}</h1><p class="page-sub">${sub}</p></div>${actions?`<div class="heading-actions"><button class="btn" data-action="refresh">${ICON('refresh','sm')} รีเฟรชข้อมูล</button><button class="btn primary" data-action="report">${ICON('download','sm')} ส่งออกรายงาน</button></div>`:''}</div>`}
function mockStrip(){return `<div class="demo-strip">${ICON('info','sm')}<span><strong>ข้อมูลสาธิต (Synthetic Demo)</strong> ข้อมูล ตัวเลข กราฟ และผู้ใช้งานในหน้านี้เป็นตัวอย่างทั้งหมด ไม่ใช่ผลสำรวจจริงจากวัดหน้าถ้ำ</span><span class="right">${ICON('shield','sm')} ไม่มีการเชื่อมฐานข้อมูลจริง</span></div>`}
function globalFilters(){return `<div class="filter-row"><div class="filter-left"><select aria-label="กรองช่วงเวลา" class="filter-select" id="periodSelect"><option value="7" ${state.period==7?'selected':''}>7 วันล่าสุด</option><option value="30" ${state.period==30?'selected':''}>30 วันล่าสุด</option><option value="90" ${state.period==90?'selected':''}>90 วันล่าสุด</option><option value="all" ${state.period==='all'?'selected':''}>ทั้งหมด</option></select><select aria-label="กรองพื้นที่" class="filter-select" id="siteSelect"><option value="all">พื้นที่สำรวจทั้งหมด</option>${state.sites.map(x=>`<option value="${ESC(x)}" ${state.site===x?'selected':''}>${ESC(x)}</option>`).join('')}</select><button class="btn" data-action="filters">${ICON('filter','sm')} ตัวกรองเพิ่มเติม ${state.origin!=='all'||state.age!=='all'||state.transport!=='all'?'•':''}</button><button class="btn tiny" data-action="reset">ล้างตัวกรอง</button></div><span class="meta-line">ข้อมูล ณ <b>19 ต.ค. 2569</b> · สถานะ DEMO</span></div>`}
function metric(label,value,ico,sub,tone='',trend=''){return `<div class="card metric"><div class="metric-top"><span class="metric-label">${label}</span><span class="metric-icon ${tone}">${ICON(ico)}</span></div><div class="metric-main">${value}</div><div class="metric-footer">${trend?`<span class="trend">${trend}</span>`:''}<span>${sub}</span></div></div>`}
function cardTitle(title,sub,side=''){return `<div class="card-head"><div><h3>${title}</h3><p>${sub}</p></div>${side}</div>`}

// Upgraded Horizontal Bar Chart (replaces raw progress bars with interactive Chart.js + fallback)
function bars(dataset,color='blue',limit=6,total=null){
  let items=dataset.slice(0,limit);
  const sum=total??dataset.reduce((a,b)=>a+b.count,0);
  const id='ch_bar_'+(++chartSeq);
  chartQueue.push({type:'bar',id,items,color,sum});
  const h=Math.max(195,items.length*38+24);
  return `<div class="chart-canvas-wrap" style="height:${h}px"><canvas id="${id}"></canvas></div>`;
}

function hexgradient(parts){let x=0;return `conic-gradient(${parts.map(([p,c])=>{let start=x;x+=p;return `${c} ${start.toFixed(2)}% ${x.toFixed(2)}%`}).join(',')})`}

// Upgraded Interactive Doughnut Chart with center metric & legend list
function donutCard(rows,values,key,title,subtitle){
  const colors=['#3659e8','#10a8a0','#f4ae46','#8b83eb','#e26562','#94a3b8'];
  let part=freq(rows,key,values),sum=part.reduce((a,b)=>a+b.count,0);
  const id='ch_donut_'+(++chartSeq);
  chartQueue.push({type:'donut',id,part,colors,sum});
  return `<div class="card">${cardTitle(title,subtitle)}<div class="card-body donut-layout"><div class="donut-canvas-box"><canvas id="${id}"></canvas><div class="donut-mid"><strong>${fmt(sum)}</strong><span>ผู้ตอบแบบสำรวจ</span></div></div><div class="donut-list">${part.slice(0,5).map((x,i)=>`<div class="item"><i class="mini-dot" style="background:${colors[i]}"></i><span>${ESC(x.name)}</span><span>${pctFmt(x.count,sum)}</span></div>`).join('')}</div></div></div>`;
}

function dateSequence(rows,duration=14){let per=new Map();let days=duration;let start=ANCHOR.getTime()-(days-1)*DAY;for(let i=0;i<days;i++){let day=new Date(start+i*DAY).toISOString().slice(0,10);per.set(day,0)}for(const r of rows)if(per.has(r.date))per.set(r.date,per.get(r.date)+1);return [...per.entries()].map(([d,n])=>({date:d,count:n}))}

// Upgraded Smooth Gradient Area Chart (Chart.js)
function lineChart(rows){
  let points=dateSequence(rows,14);
  const id='ch_line_'+(++chartSeq);
  chartQueue.push({type:'line',id,points});
  return `<div class="chart-canvas-wrap" style="height:235px"><canvas id="${id}"></canvas></div>`;
}

function mountQueuedCharts(){
  if(typeof Chart==='undefined')return;
  Chart.defaults.font.family="Inter, 'Noto Sans Thai', -apple-system, BlinkMacSystemFont, sans-serif";
  Chart.defaults.color='#7f8da4';

  const colorMap={
    blue:{solid:'#3659e8',soft:'rgba(54, 89, 232, 0.85)',hover:'#2345d7'},
    teal:{solid:'#10a8a0',soft:'rgba(16, 168, 160, 0.85)',hover:'#0d8a83'},
    orange:{solid:'#f4ae46',soft:'rgba(244, 174, 70, 0.88)',hover:'#e09628'},
    purple:{solid:'#8d79d8',soft:'rgba(141, 121, 216, 0.85)',hover:'#755ec9'}
  };

  // Custom plugin to draw values at the end of horizontal bars
  const barValueLabelPlugin={
    id:'barValueLabels',
    afterDatasetsDraw(chart){
      const {ctx}=chart;
      const meta=chart.getDatasetMeta(0);
      if(!meta||!meta.data)return;
      const sum=chart.config.options.plugins?.barValueLabels?.sum||0;
      ctx.save();
      ctx.font="700 11px Inter, 'Noto Sans Thai', sans-serif";
      ctx.fillStyle='#36425c';
      ctx.textBaseline='middle';
      meta.data.forEach((bar,index)=>{
        const raw=chart.data.datasets[0].data[index];
        const labelText=`${visibleNum(raw)} (${pctFmt(raw,sum)})`;
        ctx.fillText(labelText,bar.x+8,bar.y);
      });
      ctx.restore();
    }
  };

  for(const item of chartQueue){
    const canvas=document.getElementById(item.id);
    if(!canvas)continue;
    const ctx=canvas.getContext('2d');

    if(item.type==='line'){
      const grad=ctx.createLinearGradient(0,0,0,230);
      grad.addColorStop(0,'rgba(54, 89, 232, 0.28)');
      grad.addColorStop(1,'rgba(54, 89, 232, 0.01)');
      activeCharts.push(new Chart(ctx,{
        type:'line',
        data:{
          labels:item.points.map(p=>`${p.date.slice(8,10)}/${p.date.slice(5,7)}`),
          datasets:[{
            label:'จำนวนผู้ตอบรายวัน',
            data:item.points.map(p=>p.count),
            borderColor:'#3659e8',
            backgroundColor:grad,
            borderWidth:3,
            fill:true,
            tension:0.38,
            pointRadius:4,
            pointHoverRadius:6,
            pointBackgroundColor:'#ffffff',
            pointBorderColor:'#3659e8',
            pointBorderWidth:2
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          interaction:{mode:'index',intersect:false},
          plugins:{
            legend:{display:false},
            tooltip:{
              backgroundColor:'#17233c',
              padding:10,
              cornerRadius:8,
              titleFont:{size:11,weight:'700'},
              bodyFont:{size:11},
              callbacks:{
                label:(c)=>` ${fmt(c.parsed.y)} คำตอบ`
              }
            }
          },
          scales:{
            x:{
              grid:{display:false},
              ticks:{font:{size:11},color:'#8795aa'}
            },
            y:{
              beginAtZero:true,
              border:{display:false},
              grid:{color:'#eef2f8'},
              ticks:{precision:0,font:{size:11},color:'#8795aa'}
            }
          }
        }
      }));
    }else if(item.type==='donut'){
      const hasData=item.sum>0;
      activeCharts.push(new Chart(ctx,{
        type:'doughnut',
        data:{
          labels:hasData?item.part.map(x=>x.name):['ไม่มีข้อมูล'],
          datasets:[{
            data:hasData?item.part.map(x=>x.count):[1],
            backgroundColor:hasData?item.colors:['#e6ebf2'],
            borderWidth:3,
            borderColor:'#ffffff',
            hoverOffset:6
          }]
        },
        options:{
          responsive:true,
          maintainAspectRatio:false,
          cutout:'68%',
          plugins:{
            legend:{display:false},
            tooltip:{
              enabled:hasData,
              backgroundColor:'#17233c',
              padding:10,
              cornerRadius:8,
              callbacks:{
                label:(c)=>{
                  const v=c.parsed;
                  return ` ${c.label}: ${visibleNum(v)} คน (${pctFmt(v,item.sum)})`;
                }
              }
            }
          }
        }
      }));
    }else if(item.type==='bar'){
      const pal=colorMap[item.color]||colorMap.blue;
      const maxVal=Math.max(1,...item.items.map(x=>x.count));
      activeCharts.push(new Chart(ctx,{
        type:'bar',
        plugins:[barValueLabelPlugin],
        data:{
          labels:item.items.map(x=>x.name),
          datasets:[{
            data:item.items.map(x=>x.count),
            backgroundColor:pal.soft,
            hoverBackgroundColor:pal.hover,
            borderRadius:7,
            borderSkipped:false,
            barThickness:16,
            maxBarThickness:20
          }]
        },
        options:{
          indexAxis:'y',
          responsive:true,
          maintainAspectRatio:false,
          layout:{padding:{right:92,top:4,bottom:4}},
          plugins:{
            legend:{display:false},
            barValueLabels:{sum:item.sum},
            tooltip:{
              backgroundColor:'#17233c',
              padding:10,
              cornerRadius:8,
              callbacks:{
                label:(c)=>{
                  const v=c.parsed.x;
                  return ` ${visibleNum(v)} คน (${pctFmt(v,item.sum)})`;
                }
              }
            }
          },
          scales:{
            x:{
              beginAtZero:true,
              suggestedMax:Math.ceil(maxVal*1.15),
              border:{display:false},
              grid:{color:'#f0f4fa'},
              ticks:{precision:0,font:{size:10.5},color:'#98a4b8'}
            },
            y:{
              border:{display:false},
              grid:{display:false},
              ticks:{font:{size:11.5,weight:'600'},color:'#4d5d76'}
            }
          }
        }
      }));
    }
  }
}

function sampleDisclosure(rows,key){const n=answered(rows,key).length;return `<div class="skeletonnote">จำนวนผู้ตอบทั้งหมด <b>${fmt(rows.length)}</b> • คำถามนี้มีผู้ตอบ <b>${fmt(n)}</b> คน • ไม่ตอบ <b>${fmt(rows.length-n)}</b> คน${state.role==='entrepreneur'?' • ปกปิดกลุ่มที่มีผู้ตอบน้อยกว่า 5':''}</div>`}
function aggregateTable(rows,key,values){let a=freq(rows,key,values),n=answered(rows,key).length;return `<div class="table-wrap"><table class="data-table"><thead><tr><th>กลุ่มข้อมูล</th><th class="right">จำนวน</th><th class="right">ร้อยละของผู้ตอบข้อนี้</th></tr></thead><tbody>${a.map(x=>`<tr><td><strong>${ESC(x.name)}</strong></td><td class="right">${visibleNum(x.count)}</td><td class="right">${pctFmt(x.count,n)}</td></tr>`).join('')}</tbody></table></div>${sampleDisclosure(rows,key)}`}
function ageTop(rows){return freq(rows,'age',AGES.slice(0,-1)).sort((a,b)=>b.count-a.count)[0]||{name:'—',count:0}}
function overview(rows){let sat=answered(rows,'satisfaction'),avg=sat.length?(sat.reduce((a,b)=>a+ +b.satisfaction,0)/sat.length).toFixed(1):'—';let outsiders=rows.filter(r=>r.origin!=='ยะลา').length,ages=freq(rows,'age',AGES),expenses=freq(answered(rows,'expense'),'expense',EXPENSE),popular=expenses.sort((a,b)=>b.count-a.count)[0];return `${headers('ภาพรวมการท่องเที่ยว','สรุปข้อมูลจากแบบสำรวจเพื่อช่วยผู้ประกอบการเข้าใจกลุ่มผู้เดินทาง')}${mockStrip()}${globalFilters()}<div class="hero"><div><span style="font-size:10px;letter-spacing:.9px;color:#c4d4ff;font-weight:800">TOURISM PULSE • DEMO</span><div style="margin-top:9px"><strong>เปลี่ยนข้อมูลการสำรวจ ให้กลายเป็นมุมมองทางธุรกิจ</strong></div><p>สำรวจข้อมูลของผู้ตอบแบบสอบถามในพื้นที่นำร่อง พร้อมดูแนวโน้มและข้อค้นพบที่นำไปใช้ประกอบการวางแผนบริการ</p><small>${ICON('map-pin','sm')} ${SITE0} · อำเภอเมืองยะลา</small></div><div class="hero-number"><strong>${fmt(rows.length)}</strong><span>คำตอบในตัวกรองปัจจุบัน</span></div></div><div class="grid kpi-grid">${metric('ผู้ตอบแบบสำรวจ',fmt(rows.length),'users','จำนวนแบบสอบถามในช่วงที่เลือก')}${metric('ความพึงพอใจเฉลี่ย',avg==='—'?'—':avg+'/5','heart',`${fmt(sat.length)} คนที่ให้คะแนน`,'pink')}${metric('ช่วงค่าใช้จ่ายที่พบบ่อย',popular?.name||'—','wallet',`${fmt(answered(rows,'expense').length)} คำตอบที่ระบุค่าใช้จ่าย`,'orange')}${metric('ผู้ตอบจากนอกจังหวัด',`${percent(outsiders,rows.length)}%`,'map-pin',`${fmt(outsiders)} จาก ${fmt(rows.length)} คน`,'mint')}</div><div class="grid chart-grid"> <div class="card">${cardTitle('จำนวนผู้ตอบแบบสำรวจ','แนวโน้มในช่วง 14 วันล่าสุดของข้อมูลสาธิต',`<span class="pill gray">${ICON('calendar','sm')} รายวัน</span>`)}<div class="card-body">${lineChart(rows)}<div class="chart-legend"><span><i class="legend-dot" style="background:#3659e8"></i>จำนวนผู้ตอบรายวัน</span><span style="margin-left:auto">ข้อมูลการสำรวจ ไม่ใช่จำนวนนักท่องเที่ยวทั้งหมด</span></div></div></div>${donutCard(rows,ORIGINS,'origin','นักท่องเที่ยวมาจากไหน','สัดส่วนพื้นที่ต้นทางของผู้ตอบแบบสำรวจ')}</div><div class="grid split-grid"><div class="card">${cardTitle('ช่วงอายุผู้ตอบ','วิเคราะห์โครงสร้างกลุ่มอายุ')}<div class="card-body">${bars(ages,'blue',6,rows.length)}</div></div><div class="card">${cardTitle('รูปแบบการเดินทาง','พาหนะหลักที่ใช้เดินทาง')}<div class="card-body">${bars(freq(rows,'transport',TRANSPORT),'teal',5,rows.length)}</div></div><div class="card">${cardTitle('กิจกรรมและการใช้จ่าย','ประเภทบริการที่ผู้ตอบระบุ')}<div class="card-body">${bars(freq(answered(rows,'purchase'),'purchase',BUY),'orange',5,answered(rows,'purchase').length)}</div></div></div><div class="business-grid"><div class="card">${cardTitle('ข้อค้นพบเบื้องต้น','สรุปจากข้อมูลที่เลือก — เป็นเพียงตัวอย่างการแปลผล')}<div class="card-body">${insightList(rows)}</div></div><div class="note-card"><span class="over">MAKE INFORMED DECISIONS</span><h3>ข้อมูลแบบไหน<br>ใช้วางแผนธุรกิจได้?</h3><p>ดูการกระจายของกลุ่มผู้ตอบ ความสนใจ และระดับความพึงพอใจ พร้อมตรวจข้อจำกัดของตัวอย่างก่อนใช้ข้อมูล</p><button data-route="insights">ดูข้อค้นพบทั้งหมด ${ICON('arrow-up-right','sm')}</button></div></div>`}
function insightList(rows){let topOrigin=freq(rows,'origin',ORIGINS).sort((a,b)=>b.count-a.count)[0];let topTransport=freq(rows,'transport',TRANSPORT).sort((a,b)=>b.count-a.count)[0];let sat=answered(rows,'satisfaction'),sat4=sat.filter(x=>x.satisfaction>=4);let insights=[['พื้นที่ต้นทางที่พบบ่อย',`ผู้ตอบที่เลือกตัวกรองนี้มาจาก ${topOrigin?.name||'—'} มากที่สุด (${topOrigin?.count||0} คน)`,'map-pin'],['พาหนะที่ใช้บ่อย',`พบการเดินทางด้วย ${topTransport?.name||'—'} มากที่สุดในกลุ่มผู้ตอบ (${topTransport?.count||0} คน)`,'compass'],['ภาพรวมความพึงพอใจ',`ผู้ที่ให้คะแนน 4–5 รวม ${sat4.length} จาก ${sat.length} คำตอบที่มีคะแนน`,'heart']];return insights.map(x=>`<div class="insight-item"><span class="insight-symbol">${ICON(x[2],'sm')}</span><div><strong>${x[0]}</strong><p>${x[1]} — ควรใช้เพื่อประกอบการพิจารณาเท่านั้น ไม่ใช่ข้อสรุปแทนประชากร</p></div></div>`).join('')}
function viewDemographics(rows){return `${headers('ข้อมูลนักท่องเที่ยว','ใครเป็นผู้ตอบแบบสำรวจ? สำรวจอายุและพื้นที่ต้นทางของผู้ตอบ')}${mockStrip()}${globalFilters()}<div class="grid kpi-grid">${metric('คำตอบภายใต้ตัวกรอง',fmt(rows.length),'users','เฉพาะผู้ตอบแบบสำรวจ')}${metric('ช่วงอายุที่พบมาก',ageTop(rows).name,'users',`${fmt(ageTop(rows).count)} คน`,'mint')}${metric('ตอบจากในจังหวัด',`${percent(rows.filter(r=>r.origin==='ยะลา').length,rows.length)}%`,'map-pin','จังหวัดยะลา','orange')}${metric('จังหวัด/กลุ่มต้นทาง',fmt(new Set(rows.map(r=>r.origin)).size),'layers','หมวดต้นทางข้อมูล','pink')}</div><div class="grid chart-grid"><div class="card">${cardTitle('สัดส่วนช่วงอายุ','จำนวนผู้ตอบต่อช่วงอายุ')}<div class="card-body">${bars(freq(rows,'age',AGES),'blue',6,rows.length)}</div></div>${donutCard(rows,ORIGINS,'origin','พื้นที่ต้นทาง','จำแนกตามพื้นที่ต้นทางผู้ตอบ')}</div><div class="card">${cardTitle('ตารางข้อมูลเชิงสรุป','แสดงข้อมูลรวมเท่านั้น ไม่เปิดเผยคำตอบรายบุคคล',`<button class="btn tiny" data-action="export-age">${ICON('download','sm')} Export CSV</button>`)}<div class="tabs"><button class="tab ${state.tab==='origin'?'active':''}" data-tab="origin">พื้นที่ต้นทาง</button><button class="tab ${state.tab==='age'?'active':''}" data-tab="age">ช่วงอายุ</button></div>${aggregateTable(rows,state.tab,state.tab==='origin'?ORIGINS:AGES)}</div>`}
function viewTravel(rows){let companion=freq(rows,'companion',COMPANION),pur=freq(rows,'purpose',PURPOSE),tr=freq(rows,'transport',TRANSPORT);return `${headers('รูปแบบการเดินทาง','ดูว่าผู้ตอบเดินทางอย่างไร มากับใคร และมีวัตถุประสงค์อะไร')}${mockStrip()}${globalFilters()}<div class="grid kpi-grid">${metric('ผู้ตอบที่นำมาวิเคราะห์',fmt(rows.length),'users','ข้อมูลตามเงื่อนไขที่เลือก')}${metric('รูปแบบพาหนะยอดนิยม',tr.sort((a,b)=>b.count-a.count)[0]?.name||'—','compass','จากคำตอบที่มี')}${metric('ผู้ร่วมเดินทางที่พบมาก',companion.sort((a,b)=>b.count-a.count)[0]?.name||'—','users','จากคำตอบที่มี','orange')}${metric('จุดประสงค์ยอดนิยม',pur.sort((a,b)=>b.count-a.count)[0]?.name||'—','spark','จากคำตอบที่มี','pink')}</div><div class="grid split-grid"><div class="card">${cardTitle('พาหนะเดินทาง','สัดส่วนตามพาหนะหลัก')}<div class="card-body">${bars(freq(rows,'transport',TRANSPORT),'blue',5,rows.length)}</div></div><div class="card">${cardTitle('เดินทางมากับใคร','ผู้ร่วมเดินทาง')}<div class="card-body">${bars(freq(rows,'companion',COMPANION),'teal',5,rows.length)}</div></div><div class="card">${cardTitle('เหตุผลที่มาเยือน','วัตถุประสงค์หลัก')}<div class="card-body">${bars(freq(rows,'purpose',PURPOSE),'orange',4,rows.length)}</div></div></div><div class="card">${cardTitle('รู้จักสถานที่ผ่านช่องทางใด','ข้อมูลเฉพาะผู้ที่ตอบคำถามเสริม')}<div class="card-body">${bars(freq(answered(rows,'discovery'),'discovery',DISCOVERY),'purple',5,answered(rows,'discovery').length)}</div>${sampleDisclosure(rows,'discovery')}</div>`}
function viewSpending(rows){let extra=answered(rows,'expense'),exp=freq(extra,'expense',EXPENSE);return `${headers('ค่าใช้จ่ายและการซื้อ','วิเคราะห์ค่าใช้จ่ายที่ผู้ตอบรายงานและประเภทบริการที่ใช้')}${mockStrip()}${globalFilters()}<div class="callout section-space">${ICON('info','sm')} ข้อมูลค่าใช้จ่ายเป็นเพียงช่วงที่ผู้ตอบระบุ ไม่ใช่ยอดขายจริงของร้านค้า หรือรายได้การท่องเที่ยวของจังหวัด</div><div class="grid kpi-grid">${metric('ผู้ให้ข้อมูลค่าใช้จ่าย',fmt(extra.length),'users',`${fmt(rows.length-extra.length)} คนไม่ได้ตอบ`)}${metric('ช่วงค่าใช้จ่ายยอดนิยม',exp.sort((a,b)=>b.count-a.count)[0]?.name||'—','wallet','ค่าใช้จ่ายที่ผู้ตอบประมาณเอง','orange')}${metric('ระบุบริการที่ใช้',fmt(answered(rows,'purchase').length),'layers','ตอบคำถามประเภทบริการ','mint')}${metric('แบบสอบถามภายใต้ตัวกรอง',fmt(rows.length),'file','ไม่ใช่จำนวนธุรกรรม') }</div><div class="grid chart-grid"><div class="card">${cardTitle('การกระจายช่วงค่าใช้จ่าย','จำนวนและสัดส่วนจากผู้ที่ตอบคำถามนี้')}<div class="card-body">${bars(freq(extra,'expense',EXPENSE),'orange',4,extra.length)}</div>${sampleDisclosure(rows,'expense')}</div><div class="card">${cardTitle('ประเภทบริการที่ใช้','คำตอบที่เลือกในแบบสำรวจ')}<div class="card-body">${bars(freq(answered(rows,'purchase'),'purchase',BUY),'teal',5,answered(rows,'purchase').length)}</div>${sampleDisclosure(rows,'purchase')}</div></div><div class="card">${cardTitle('ข้อเสนอสำหรับการนำข้อมูลไปใช้','ใช้ร่วมกับความต้องการจริงของแต่ละประเภทธุรกิจ')}<div class="card-body"><div class="method-grid"><div class="method-item"><strong>ร้านอาหารและเครื่องดื่ม</strong><p>ใช้ดูช่วงค่าใช้จ่ายและลักษณะกลุ่มผู้ตอบเพื่อประกอบการวางแผนสินค้า ไม่ตีความเป็นยอดขายจริง</p></div><div class="method-item"><strong>ร้านค้าและของฝาก</strong><p>ดูสัดส่วนผู้ตอบที่ระบุการซื้อสินค้า ช่วยตั้งสมมติฐานในการเลือกสินค้าที่ต้องการสำรวจต่อ</p></div></div></div></div>`}
function viewSatisfaction(rows){const sat=answered(rows,'satisfaction');let avg=sat.length?(sat.reduce((a,b)=>a+ +b.satisfaction,0)/sat.length).toFixed(2):'—';const f=freq(sat,'satisfaction',[5,4,3,2,1]),rev=answered(rows,'revisit');return `${headers('ความพึงพอใจ','ความคิดเห็นของผู้ตอบต่อสถานที่ท่องเที่ยว ไม่ใช่คะแนนประเมินตัว Dashboard')}${mockStrip()}${globalFilters()}<div class="grid kpi-grid">${metric('คะแนนเฉลี่ย',avg==='—'?'—':avg+'/5','heart',`${fmt(sat.length)} คนที่ให้คะแนน`,'pink')}${metric('พึงพอใจระดับ 4–5',`${percent(sat.filter(r=>r.satisfaction>=4).length,sat.length)}%`,'checks','จากผู้ตอบคะแนนเท่านั้น','mint')}${metric('ตั้งใจกลับมาแน่นอน',`${percent(rev.filter(r=>r.revisit==='กลับมาแน่นอน').length,rev.length)}%`,'refresh','จากผู้ตอบคำถามนี้')}${metric('ผู้ที่ข้ามคำถาม',fmt(rows.length-sat.length),'file','กรณีคะแนนความพึงพอใจ','orange')}</div><div class="grid chart-grid"><div class="card">${cardTitle('ระดับความพึงพอใจ','การกระจายคะแนน 1–5')}<div class="card-body">${bars(f.map(x=>({name:`${x.name} คะแนน`,count:x.count})),'teal',5,sat.length)}</div>${sampleDisclosure(rows,'satisfaction')}</div>${donutCard(rev,REVISIT,'revisit','ความตั้งใจกลับมาเยือน','ตอบคำถามเพิ่มเติมโดยสมัครใจ')}</div><div class="callout blue">การตอบว่า “จะกลับมาแน่นอน” เป็นความตั้งใจที่ผู้ตอบระบุในแบบสำรวจ ไม่ใช่หลักฐานว่ากลับมาเยือนแล้วจริง</div>`}
function viewInsights(rows){let topOrigin=freq(rows,'origin',ORIGINS).sort((a,b)=>b.count-a.count)[0];return `${headers('ข้อค้นพบสำหรับธุรกิจ','แนวทางนำข้อมูลสำรวจไปประกอบการวางแผน ไม่ใช่ข้อสรุปทางธุรกิจที่พิสูจน์แล้ว')}${mockStrip()}${globalFilters()}<div class="grid business-grid"><div class="card">${cardTitle('สรุปข้อมูลที่น่าสนใจ','ระบบสร้างข้อความจากข้อมูลภายใต้ตัวกรอง')}<div class="card-body">${insightList(rows)}</div></div><div class="note-card"><div class="over">DATA-INFORMED, NOT DATA-DRIVEN ASSUMPTIONS</div><h3>เลือกใช้ข้อมูลเท่าที่จำเป็น</h3><p>ตัวอย่างข้อมูลนี้ใช้เพื่อทดสอบหน้าจอ ยังไม่ใช่ผลวิจัยจริง และยังไม่สามารถสรุปแทนนักท่องเที่ยวทั้งหมดได้</p><button data-route="methodology">ดูหลักการใช้ข้อมูล ${ICON('arrow-up-right','sm')}</button></div></div><div class="card" style="margin-top:18px">${cardTitle('ตัวอย่างการตั้งคำถามเพื่อใช้ตัดสินใจ','เลือกประเภทธุรกิจเพื่อดูแนวทางการใช้ข้อมูล')}<div class="card-body"><div class="method-grid">${[['ร้านอาหาร/เครื่องดื่ม','ผู้ตอบมากับครอบครัวมากน้อยเพียงใด และมีช่วงค่าใช้จ่ายใดที่น่าสนใจ'],['ที่พัก','ผู้ตอบมาจากนอกจังหวัดมากน้อยเพียงใด และเดินทางแบบกลุ่มใด'],['ร้านค้า/ของฝาก','ผู้ตอบเคยซื้อสินค้าหรือของฝากระหว่างเดินทางหรือไม่'],['บริการเดินทาง','นักท่องเที่ยวเดินทางด้วยพาหนะประเภทใดบ่อยที่สุด']].map(([a,b])=>`<div class="method-item"><strong>${a}</strong><p>${b}</p></div>`).join('')}</div></div></div>`}
function viewReports(rows){return `${headers('รายงานและส่งออก','สรุปข้อมูลสาธิตเป็นไฟล์รวม ไม่ส่งออกคำตอบรายบุคคล')}${mockStrip()}${globalFilters()}<div class="grid split-grid"><div class="card">${cardTitle('รายงานภาพรวม','ดาวน์โหลดข้อมูลเชิงสรุปเท่านั้น')}<div class="card-body"><div class="card-inset"><strong>Tourism Summary — Demo</strong><p class="help">จำนวนผู้ตอบ: ${fmt(rows.length)} · พื้นที่: ${state.site==='all'?'ทุกพื้นที่':ESC(state.site)} · ช่วงเวลา: ${state.period==='all'?'ทั้งหมด':`${state.period} วัน`}</p><div class="chips"><span class="chip">ข้อมูลสาธิต</span><span class="chip">Aggregate only</span><span class="chip">ไม่ระบุตัวบุคคล</span></div></div><div style="display:flex;gap:10px;margin-top:15px;flex-wrap:wrap"><button class="btn primary" data-action="export-summary">${ICON('download','sm')} ดาวน์โหลด CSV สรุป</button><button class="btn" data-action="print">${ICON('file','sm')} พิมพ์ / บันทึกเป็น PDF</button></div></div></div><div class="card">${cardTitle('รายการข้อมูลที่ส่งออก','เลือกชนิดข้อมูลก่อนดาวน์โหลด')}<div class="card-body">${[['demographics','ข้อมูลอายุและต้นทาง'],['travel','รูปแบบการเดินทาง'],['spending','ค่าใช้จ่าย'],['satisfaction','ความพึงพอใจ']].map(([k,v])=>`<button class="btn" data-export="${k}" style="display:flex;width:100%;justify-content:space-between;margin-bottom:10px">${v}${ICON('download','sm')}</button>`).join('')}</div></div><div class="card">${cardTitle('สิ่งที่ต้องระบุทุกครั้ง','ข้อควรระวังเมื่ออ้างอิงผล')}<div class="card-body"><p class="help">ระบุที่มาข้อมูล ช่วงเวลาที่เก็บ จำนวนผู้ตอบจริง วิธีเลือกกลุ่มตัวอย่าง และจำนวนคำตอบของแต่ละคำถามเสริม หลีกเลี่ยงการอ้างว่าเป็นข้อมูลแทนผู้เยี่ยมเยือนทั้งหมดหรือยอดขายธุรกิจ</p></div></div></div>`}
function viewMethodology(){return `${headers('แหล่งข้อมูลและวิธีอ่าน','ความหมายของตัวชี้วัด ขอบเขตการสำรวจ และการปกป้องข้อมูล',false)}${mockStrip()}<div class="grid method-grid"><div class="card">${cardTitle('แหล่งข้อมูล','ระบบจริงในอนาคต')}<div class="card-body"><p class="help">Google Forms → Google Apps Script → API/Edge Function → Supabase PostgreSQL → Dashboard โดยต้องมีการยินยอม คัดกรอง และป้องกันรายการซ้ำ</p><div class="chips"><span class="chip">Google Forms</span><span class="chip">Apps Script</span><span class="chip">Supabase</span><span class="chip">Next.js</span></div></div></div><div class="card">${cardTitle('พื้นที่ศึกษา','เวอร์ชันนำร่อง')}<div class="card-body"><strong>${SITE0}</strong><p class="help">อำเภอเมืองยะลา จังหวัดยะลา ระบบออกแบบให้เพิ่มพื้นที่ในอนาคตได้ แต่ตัวอย่างเริ่มจากพื้นที่เดียว และยังไม่เชื่อมฐานข้อมูลจริง</p></div></div><div class="card">${cardTitle('จำนวนผู้ตอบ (n)','หลักการนับข้อมูล')}<div class="card-body"><p class="help">แสดงจำนวนแบบสอบถามที่ผ่านเกณฑ์และตัวกรอง สำหรับคำถามไม่บังคับจะใช้จำนวนผู้ตอบคำถามนั้นเป็นตัวหาร ไม่ใช้จำนวนแบบสอบถามทั้งหมดโดยอัตโนมัติ</p></div></div><div class="card">${cardTitle('ข้อมูลสำรวจไม่ใช่อะไร','ข้อควรระวังการแปลผล')}<div class="card-body"><p class="help">ไม่ใช่ยอดเช็กอินทั้งหมด ไม่ใช่จำนวนนักท่องเที่ยวทั้งจังหวัด ไม่ใช่ยอดขายจริง และไม่ใช่หลักฐานว่ารายได้เพิ่มขึ้น ใช้เพื่อประกอบการตัดสินใจเท่านั้น</p></div></div><div class="card">${cardTitle('ความเป็นส่วนตัว','ออกแบบระบบจริงให้ปลอดภัย')}<div class="card-body"><p class="help">ผู้ประกอบการดูได้เฉพาะข้อมูลสรุป ไม่มีข้อมูลระบุตัวบุคคล ส่วนผู้ดูแลนำเข้าได้ตามสิทธิ์ ในระบบจริงต้องบังคับสิทธิ์จาก Backend และฐานข้อมูล ไม่ใช่ซ่อนปุ่มอย่างเดียว</p></div></div><div class="card">${cardTitle('ข้อมูลสาธิต','ขอบเขตต้นแบบ HTML')}<div class="card-body"><p class="help">หน้าเว็บนี้ใช้ชุดข้อมูลจำลองที่สร้างในเครื่องผู้ใช้ ไม่ส่งข้อมูลไปเซิร์ฟเวอร์ การนำเข้า CSV เป็นเพียงการจำลองในหน่วยความจำ และจะหายเมื่อโหลดหน้าเว็บใหม่</p></div></div></div>`}
function csvTemplate(){let header=['response_key','date','site','consent','eligible','age','origin','transport','companion','purpose','discovery','expense','purchase','satisfaction','revisit'];let row=['test-example-1','2026-10-18',SITE0,'yes','yes','25–34 ปี','ยะลา','รถยนต์ส่วนตัว','ครอบครัว','พักผ่อน','Facebook / TikTok','301–500 บาท','อาหาร/เครื่องดื่ม','4','อาจกลับมา'];downloadCSV('survey-import-template.csv',[header,row]);toast('ดาวน์โหลด CSV ตัวอย่างแล้ว')}
function viewImports(){let preview=state.importPreview;return `${headers('นำเข้าข้อมูลสำรวจ','ศูนย์นำเข้าข้อมูลของผู้ดูแล — จำลองขั้นตอนตรวจ CSV ก่อนบันทึก',false)}${mockStrip()}<div class="grid two-col"><div class="card">${cardTitle('นำเข้าคำตอบจาก Google Forms','เลือก CSV ที่ Export จาก Google Sheets หรือใช้ข้อมูลตัวอย่าง')}<div class="card-body"><div class="stepper"><div class="step ${preview?'':'active'}"><span class="step-circle">1</span> เลือกไฟล์</div><span class="step-divider"></span><div class="step ${preview?'active':''}"><span class="step-circle">2</span> ตรวจสอบ</div><span class="step-divider"></span><div class="step"><span class="step-circle">3</span> บันทึก</div></div><div class="upload-zone" id="dropzone"><div class="upload-ico">${ICON('upload','xl')}</div><strong>วางไฟล์ CSV ที่นี่ หรือเลือกไฟล์จากเครื่อง</strong><p>รองรับ CSV ที่มีคอลัมน์ตัวอย่างที่ระบุไว้ • ระบบสาธิตไม่ส่งไฟล์ออกจากเครื่อง</p><label class="btn primary" for="csvInput">${ICON('upload','sm')} เลือกไฟล์ CSV</label><input type="file" id="csvInput" accept=".csv,text/csv"/></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px"><button class="btn" data-action="template">${ICON('download','sm')} ดาวน์โหลด CSV ตัวอย่าง</button><button class="btn" data-action="demo-import">${ICON('spark','sm')} ลองนำเข้าชุดสาธิต</button></div>${preview?importPreviewHTML(preview):''}</div></div><div class="card">${cardTitle('ขั้นตอนนำเข้าอย่างปลอดภัย','ระบบจริงต้องตรวจสอบบน Server อีกครั้ง')}<div class="card-body">${[['อัปโหลดไฟล์','เลือกไฟล์จาก Google Forms / Sheets'],['ตรวจสิทธิ์และการยินยอม','คัดเฉพาะรายการยินยอมและเข้าเกณฑ์'],['ตรวจข้อผิดพลาดและรายการซ้ำ','ดูตัวอย่างและผลตรวจสอบก่อนบันทึก'],['ยืนยันนำเข้า','เก็บเฉพาะข้อมูลจำเป็น ไม่บันทึก PII']].map(([a,b],i)=>`<div class="insight-item"><span class="insight-symbol">${i+1}</span><div><strong>${a}</strong><p>${b}</p></div></div>`).join('')}<div class="callout blue" style="margin-top:14px">หมายเหตุ: V1 จริงอาจใช้ Google Forms → Apps Script → Supabase โดยตรงได้ หน้านี้เป็นทางเลือกสำหรับ CSV สำรองและตรวจข้อมูลเท่านั้น</div></div></div></div>`}

  document.getElementById('roleName').textContent=state.role==='admin'?'ผู้ดูแลระบบ':'ผู้ประกอบการ';
  document.getElementById('avatar').textContent=state.role==='admin'?'AD':'EN';
  renderNav();
  let rows=filtered(),views={overview,demographics:viewDemographics,travel:viewTravel,spending:viewSpending,satisfaction:viewSatisfaction,insights:viewInsights,reports:viewReports,methodology:viewMethodology,imports:viewImports,history:viewHistory,sites:viewSites,users:viewUsers,settings:viewSettings};

  }
}

function CSVparse(src){src=src.replace(/^\uFEFF/,'');let rows=[],row=[],v='',quoted=false;for(let i=0;i<src.length;i++){const c=src[i];if(c==='"'){if(quoted&&src[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&src[i+1]==='\n')i++;row.push(v);if(row.some(x=>x.trim()!==''))rows.push(row);row=[];v=''}else v+=c}row.push(v);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function parseRecords(input){let raw=CSVparse(input);if(!raw.length)return {good:[],bad:[{reason:'ไฟล์ว่าง'}],dup:0};const cols=raw.shift().map(x=>x.trim().toLowerCase());const required=['response_key','date','site','consent','eligible','age','origin','transport','companion','purpose'];if(required.some(x=>!cols.includes(x)))return {good:[],bad:[{reason:'ขาดคอลัมน์ '+required.filter(x=>!cols.includes(x)).join(', ')}],dup:0};let dup=0,good=[],bad=[],seen=new Set(DATA.map(x=>x.id));for(let i=0;i<raw.length;i++){let cells=raw[i],obj=Object.fromEntries(cols.map((k,j)=>[k,String(cells[j]??'').trim()]));let id=obj.response_key,date=obj.date,consent=obj.consent.toLowerCase(),eligible=obj.eligible.toLowerCase();let fail=null;if(!id)fail='ไม่มี response_key';else if(!['yes','true','1','ยินยอม'].includes(consent))fail='ไม่มีความยินยอม';else if(!['yes','true','1','ใช่'].includes(eligible))fail='ไม่เข้าเกณฑ์';else if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||Number.isNaN(Date.parse(date)))fail='วันที่ไม่ถูกต้อง';else if(!state.sites.includes(obj.site))fail='พื้นที่ไม่อยู่ในรายการ';else if(!AGES.includes(obj.age)||!ORIGINS.includes(obj.origin)||!TRANSPORT.includes(obj.transport)||!COMPANION.includes(obj.companion)||!PURPOSE.includes(obj.purpose))fail='ค่าในคอลัมน์จำเป็นไม่ตรงกับตัวเลือก';if(fail){bad.push({reason:`แถว ${i+2}: ${fail}`});continue}if(seen.has(id)){dup++;continue}seen.add(id);let satis=obj.satisfaction&&[1,2,3,4,5].includes(Number(obj.satisfaction))?Number(obj.satisfaction):null;good.push({id,date,site:obj.site,age:obj.age,origin:obj.origin,transport:obj.transport,companion:obj.companion,purpose:obj.purpose,discovery:DISCOVERY.includes(obj.discovery)?obj.discovery:null,expense:EXPENSE.includes(obj.expense)?obj.expense:null,purchase:BUY.includes(obj.purchase)?obj.purchase:null,satisfaction:satis,revisit:REVISIT.includes(obj.revisit)?obj.revisit:null,synthetic:false})}return {good,bad,dup}}
function previewFile(file){if(!file)return;file.text().then(x=>{try{state.importPreview={...parseRecords(x),name:file.name};render();toast('ตรวจสอบไฟล์ CSV เรียบร้อยแล้ว')}catch(err){toast('อ่านไฟล์ CSV ไม่สำเร็จ: '+err.message)}})}
function bindUploader(){let input=document.getElementById('csvInput');if(input)input.addEventListener('change',e=>previewFile(e.target.files?.[0]));const drop=document.getElementById('dropzone');if(drop){drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('dragover')});drop.addEventListener('dragleave',()=>drop.classList.remove('dragover'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('dragover');previewFile(e.dataTransfer.files?.[0])})}}
function downloadCSV(name,rows){let csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportAggregate(type){let rows=filtered(),dict={demographics:['age',AGES],travel:['transport',TRANSPORT],spending:['expense',EXPENSE],satisfaction:['satisfaction',[5,4,3,2,1]],origin:['origin',ORIGINS]};const src=dict[type]||dict.demographics;let [key,values]=src;let answeredrows=answered(rows,key),n=answeredrows.length,stats=freq(answeredrows,key,values);let out=[['YALA INSIGHT - SYNTHETIC DEMO (aggregate only)'],['กลุ่มข้อมูล','จำนวนผู้ตอบ','ร้อยละ (จากผู้ตอบคำถามนี้)','ตัวหาร n']];for(const x of stats)out.push([x.name,suppressed(x.count)?'ซ่อนข้อมูลกลุ่มเล็ก':x.count,suppressed(x.count)?'ซ่อน':percent(x.count,n)+'%',n]);downloadCSV(`yala-demo-${key}-aggregate.csv`,out);toast('ส่งออกข้อมูลสรุปแล้ว')}

function addSiteModal(){modal('เพิ่มพื้นที่สำรวจ (Demo)',`<label class="form-label" for="newSite">ชื่อพื้นที่ใหม่</label><input class="field" id="newSite" placeholder="ชื่อแหล่งท่องเที่ยวในพื้นที่ศึกษา"/><p class="help">จะเพิ่มเฉพาะชื่อพื้นที่ ไม่สร้างคำตอบตัวอย่างขึ้นมาเอง</p>`,`<button class="btn" data-close-modal>ยกเลิก</button><button class="btn primary" data-action="save-site">เพิ่มพื้นที่</button>`)}
function inviteUserModal(){modal('เพิ่มผู้ใช้งานตัวอย่าง',`<div class="formgrid"><div><label class="form-label" for="newUserName">ชื่อสำหรับการสาธิต</label><input class="field" id="newUserName" placeholder="ผู้ประกอบการตัวอย่าง"/></div><div><label class="form-label" for="newUserRole">บทบาท</label><select class="field" id="newUserRole"><option value="Entrepreneur">Entrepreneur</option><option value="Admin">Admin</option></select></div></div><p class="help">ระบบสาธิตจะไม่ส่งอีเมลจริง และไม่สร้างบัญชีใน Supabase</p>`,`<button class="btn" data-close-modal>ยกเลิก</button><button class="btn primary" data-action="save-user">เพิ่มผู้ใช้สาธิต</button>`)}
function perform(action){switch(action){case 'refresh':render();toast('อัปเดตข้อมูลบนหน้าจอแล้ว (Demo)');break;case 'report':report();break;case 'print':closeModal();setTimeout(()=>window.print(),100);break;case 'filters':filterModal();break;case 'reset':Object.assign(state,{origin:'all',age:'all',transport:'all',site:'all',period:90});render();toast('ล้างตัวกรองแล้ว');break;case 'apply-advanced':for(const x of ['origin','age','transport'])state[x]=document.getElementById('advanced_'+x).value;closeModal();render();toast('ใช้ตัวกรองแล้ว');break;case 'clear-advanced':for(const x of ['origin','age','transport'])state[x]='all';closeModal();render();toast('ล้างตัวกรองเพิ่มเติมแล้ว');break;case 'export-summary':summaryExport();break;case 'export-age':exportAggregate('demographics');break;case 'template':csvTemplate();break;case 'demo-import':state.importPreview={good:[{...makeSynthetic(1)[0],id:'extra-demo-'+Math.round(rand()*1e8)}],bad:[],dup:0,name:'one-row-demo.csv'};render();toast('สร้างรายการตัวอย่างที่พร้อมนำเข้า 1 รายการ');break;case 'cancel-import':state.importPreview=null;render();toast('ยกเลิกการนำเข้า');break;case 'confirm-import':if(state.importPreview){let p=state.importPreview,good=p.good;DATA.push(...good);state.imports.unshift({name:p.name,date:new Date().toLocaleDateString('th-TH'),good:good.length,bad:p.bad.length,duplicates:p.dup,status:'นำเข้าสู่หน่วยความจำแล้ว'});state.importPreview=null;state.period='all';render();toast(`นำเข้าข้อมูล ${good.length} รายการสำเร็จ (เฉพาะในหน้า Demo)`)}break;case 'add-site':addSiteModal();break;case 'save-site':{let name=document.getElementById('newSite')?.value?.trim();if(!name){toast('กรุณาระบุชื่อพื้นที่');break}if(state.sites.includes(name)){toast('ชื่อพื้นที่มีอยู่แล้ว');break}state.sites.push(name);closeModal();render();toast('เพิ่มพื้นที่สาธิตแล้ว');break}case 'invite-user':inviteUserModal();break;case 'save-user':{let name=document.getElementById('newUserName')?.value?.trim(),role=document.getElementById('newUserRole')?.value;if(!name){toast('กรุณากรอกชื่อผู้ใช้');break}state.users.push({name,role,status:'ใช้งาน',last:'ยังไม่เข้าใช้งาน'});closeModal();render();toast('เพิ่มบัญชีตัวอย่างแล้ว (ไม่มีการเชิญจริง)');break}case 'save-settings':toast('บันทึกการตั้งค่าในต้นแบบแล้ว');break;case 'dismiss-pop':document.getElementById('topPopover').innerHTML='';toast('อ่านการแจ้งเตือนแล้ว');break}}
// Delegate click actions throughout the single-page prototype.
document.addEventListener('click',e=>{let nav=e.target.closest('[data-route]');if(nav){closeModal();go(nav.dataset.route);return}let btn=e.target.closest('[data-action]');if(btn){perform(btn.dataset.action);return}let tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return}let exportBtn=e.target.closest('[data-export]');if(exportBtn){exportAggregate(exportBtn.dataset.export);return}let role=e.target.closest('[data-role]');if(role){state.role=role.dataset.role;render();toast('เปลี่ยนมุมมองบทบาทแล้ว (Demo)');return}if(e.target.closest('[data-close-modal]')){closeModal();return}if(e.target.id==='modalOverlay'){closeModal();return}if(e.target.id==='searchBtn'||e.target.closest('#searchBtn')){showSearch();return}if(e.target.closest('#notificationBtn')){showNotifications();return}if(e.target.closest('#profileBtn')){showProfile();return}if(e.target.closest('#mobileNav')){document.getElementById('sidebar').classList.toggle('open');document.getElementById('scrim').classList.toggle('show');return}if(e.target.id==='scrim'){document.getElementById('sidebar').classList.remove('open');e.target.classList.remove('show');return}if(!e.target.closest('.popover'))document.getElementById('topPopover').innerHTML=''});
document.addEventListener('change',e=>{if(e.target.id==='periodSelect'){state.period=e.target.value==='all'?'all':Number(e.target.value);render()}if(e.target.id==='siteSelect'){state.site=e.target.value;render()}if(e.target.id==='roleSelect'){state.role=e.target.value;render();toast('เปลี่ยนบทบาทสาธิตแล้ว')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('topPopover').innerHTML='';document.getElementById('sidebar').classList.remove('open');document.getElementById('scrim').classList.remove('show')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showSearch()}});
document.addEventListener('pointerover',e=>{let el=e.target.closest('[data-tip]');if(!el)return;let t=document.getElementById('tooltip');t.textContent=el.dataset.tip;t.style.display='block';let rect=el.getBoundingClientRect();t.style.left=(rect.left+rect.width/2)+'px';t.style.top=(rect.top-7)+'px'});document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))document.getElementById('tooltip').style.display='none'});
render();
</script></body></html>
